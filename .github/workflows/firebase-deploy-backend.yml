name: Deploy Firestore rules + Storage rules + Cloud Functions
on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - 'functions/**'
      - '.github/workflows/firebase-deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write service account key
        id: sa
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THE_1P_LEADERSHIP }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "path=$RUNNER_TEMP/sa.json" >> "$GITHUB_OUTPUT"
          echo "SA client_email: $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["client_email"])' "$RUNNER_TEMP/sa.json")"

      # Rules deploy FIRST, and on its own.
      #
      # These two deploys have different requirements: rules and indexes need
      # no billing, while a functions deploy reads Secret Manager, which does.
      # They used to run as a single `firebase deploy` command, so when billing
      # lapsed the whole command aborted on the secrets lookup and the rules —
      # already compiled and valid — were never pushed. Security rules silently
      # stopped deploying for weeks while the workflow reported the failure as
      # "functions".
      #
      # Rules also go before `npm install` so a dependency problem in
      # functions/ can't block a security-rule change either.
      - name: Deploy Firestore rules + indexes + Storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.path }}
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project the-1p-leadership \
            --non-interactive \
            --force

      # Runtime config for the functions.
      #
      # These are plain process.env values (Twilio, the Google OAuth client,
      # the automation tick secret) rather than Secret Manager entries, so
      # `firebase deploy` takes them from functions/.env. That file is
      # gitignored, which means a deploy that does not write it can redeploy
      # the functions without these values and quietly switch off calling,
      # texting and the calendar. Writing it here from repository secrets
      # makes CI the single source of truth.
      #
      # Only non-empty secrets are written, so partial configuration works:
      # every feature reports "not set up yet" until its own vars exist.
      - name: Write functions runtime env
        working-directory: functions
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWILIO_TWIML_APP_SID: ${{ secrets.TWILIO_TWIML_APP_SID }}
          TWILIO_CALLER_ID: ${{ secrets.TWILIO_CALLER_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          CRM_TICK_SECRET: ${{ secrets.CRM_TICK_SECRET }}
          SENDGRID_WEBHOOK_KEY: ${{ secrets.SENDGRID_WEBHOOK_KEY }}
          FUNCTIONS_BASE_URL: ${{ secrets.FUNCTIONS_BASE_URL }}
        run: |
          : > .env
          set_count=0
          for name in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM_NUMBER \
                      TWILIO_API_KEY_SID TWILIO_API_KEY_SECRET TWILIO_TWIML_APP_SID \
                      TWILIO_CALLER_ID GOOGLE_OAUTH_CLIENT_ID \
                      GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REDIRECT_URI \
                      CRM_TICK_SECRET SENDGRID_WEBHOOK_KEY FUNCTIONS_BASE_URL; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .env
              set_count=$((set_count + 1))
              echo "  set $name"
            else
              echo "  (unset) $name"
            fi
          done
          echo "Wrote functions/.env with $set_count value(s)."
          if [ "$set_count" -eq 0 ]; then
            echo "::warning::No runtime secrets are configured, so calling, texting and calendar sync stay dormant. See functions/.env.example."
          fi

      - name: Install function deps
        working-directory: functions
        run: npm install --no-audit --no-fund

      # Wrapped so a real failure is distinguishable from the two stranded
      # scheduled functions this project cannot delete. See the script.
      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.path }}
        run: ./scripts/deploy-functions.sh
