name: Seed The Focus Tax
# Writes the essay series (reads/the-focus-tax and its essays) to Firestore by running
# scripts/seed-focus-tax.js with the deploy service account. The public pages
# at /reads ship with hosting; the full text members read lives in Firestore
# and only exists once the seed runs. Running it here means a release, or an
# edit to an essay, needs no terminal.
#
# Safe to run on every push: it rewrites the essays from the markdown, and
# keeps the old Focus Tax course record retired (status inactive).
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/seed-focus-tax.js'
      - 'scripts/focus-tax-content/**'
      - 'scripts/lib/essays.js'
      - 'scripts/lib/markdown.js'
      - '.github/workflows/seed-focus-tax.yml'
  workflow_dispatch:

concurrency:
  group: seed-focus-tax
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write service account key
        id: sa
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_THE_1P_LEADERSHIP }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "path=$RUNNER_TEMP/sa.json" >> "$GITHUB_OUTPUT"

      - name: Install script dependencies
        working-directory: scripts
        run: npm ci

      - name: Seed
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.sa.outputs.path }}
        run: node seed-focus-tax.js
