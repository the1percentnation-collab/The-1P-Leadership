<!DOCTYPE html>
<!-- login page -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RBH536HRZE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-RBH536HRZE");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.static.com" crossorgin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* "Sign up for free" prompt that points at the Create an account link */
    .signup-anchor { position: relative; display: inline-block; }
    .signup-tip {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--red, #E60306);
      color: #fff;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: 0 10px 30px rgba(230, 3, 6, 0.35), 0 4px 10px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
      z-index: 60;
    }
    .signup-tip strong { font-weight: 700; }
    .signup-tip.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
      animation: signupTipBob 2.4s ease-in-out 0.4s infinite;
    }
    .signup-tip-arrow {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border: 7px solid transparent;
      border-top-color: var(--red, #E60306);
    }
    /* Nudge attention onto the link itself while the tip is up */
    #link-signup.signup-pulse {
      color: var(--red, #E60306);
      text-shadow: 0 0 12px var(--red-glow, rgba(230,3,6,0.5));
    }
    @keyframes signupTipBob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signup-tip.show { animation: none; }
      .signup-tip { transition: opacity .4s ease; transform: translateX(-50%); }
    }
  </style>
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="https://the1pnation.com" aria-label="The One Percent Nation">
        <img src="/assets/academy-logo.png" alt="" class="auth-brand-mark">

      </a>
      <div class="brand-badge">Member Portal</div>
      <h1>SIGN <span>IN</span></h1>
      <div class="auth-sub">Welcome back. Continue your journey.</div>

      <div id="auth-msg"></div>

      <form class="auth-form" id="login-form" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <button class="btn btn-primary" type="submit" id="btn-submit">Sign in</button>
        <button class="btn btn-google" type="button" id="btn-google">Continue with Google</button>
      </form>

      <div class="auth-footer">
        <span class="signup-anchor">
          <a href="/signup.html" id="link-signup">Create an account</a>
          <span class="signup-tip" id="signup-tip" role="status" aria-live="polite">
            Not a member? <strong>Sign up for free</strong>
            <span class="signup-tip-arrow"></span>
          </span>
        </span>
        <a href="#" id="link-forgot">Forgot password?</a>
      </div>
      <div class="auth-back">
        <a class="back-to-main" href="https://the1pnation.com">← Back to Main Site</a>
      </div>
    </div>
  </div>

  <!-- Standalone (non-module) so it runs even if Firebase/module imports fail. -->
  <script>
    (function signupNudge() {
      function start() {
        var tip = document.getElementById('signup-tip');
        var link = document.getElementById('link-signup');
        if (!tip || !link) return;
        var dismissed = false;
        function hide() {
          dismissed = true;
          tip.classList.remove('show');
          link.classList.remove('signup-pulse');
        }
        var showTimer = setTimeout(function () {
          if (dismissed) return;
          tip.classList.add('show');
          link.classList.add('signup-pulse');
          setTimeout(function () { if (!dismissed) hide(); }, 9000); // auto-dismiss
        }, 3000);
        link.addEventListener('click', function () { clearTimeout(showTimer); });
        ['email', 'password'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.addEventListener('focus', hide, { once: true });
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
    })();
  </script>

  <script type="module">
    import { loginEmail, loginGoogle, resetPassword, onAuthReady } from './js/auth.js';
    import { firebaseReady } from './js/firebase.js';

    const $ = (id) => document.getElementById(id);
    const msg = $('auth-msg');

    function showErr(txt) { msg.innerHTML = `<div class="auth-error">${txt}</div>`; }
    function showOk(txt) { msg.innerHTML = `<div class="auth-ok">${txt}</div>`; }
    function clearMsg() { msg.innerHTML = ''; }

    function nextUrl() {
      const p = new URLSearchParams(location.search);
      const n = p.get('next');
      return n && n.startsWith('/') ? n : '/dashboard';
    }

    if (!firebaseReady) {
      showErr('Authentication service is unreachable. Check your connection and retry.');
    }

    // If already signed in, bounce to next.
    onAuthReady((u) => { if (u) location.replace(nextUrl()); });

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMsg();
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) return showErr('Email and password required.');
      $('btn-submit').disabled = true;
      try {
        await loginEmail(email, password);
        location.replace(nextUrl());
      } catch (err) {
        showErr(err.message || 'Sign-in failed.');
      } finally {
        $('btn-submit').disabled = false;
      }
    });

    $('btn-google').addEventListener('click', async () => {
      clearMsg();
      try {
        await loginGoogle();
        location.replace(nextUrl());
      } catch (err) {
        showErr(err.message || 'Google sign-in failed.');
      }
    });

    $('link-forgot').addEventListener('click', async (e) => {
      e.preventDefault();
      clearMsg();
      const email = $('email').value.trim();
      if (!email) return showErr('Enter your email first, then click Forgot password.');
      try {
        await resetPassword(email);
        showOk('Password reset email sent. Check your inbox.');
      } catch (err) {
        showErr(err.message || 'Could not send reset email.');
      }
    });
  </script>
</body>
</html>
