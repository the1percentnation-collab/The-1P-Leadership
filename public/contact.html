<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RBH536HRZE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-RBH536HRZE");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="console-shell">
    <div class="console-topbar">
      <div class="console-topbar-left">
        <a class="console-brand" href="/dashboard.html" aria-label="The One Percent Academy">
          <img src="/assets/academy-logo.png" alt="" class="console-brand-mark">

        </a>
        <a class="back-to-main" href="https://the1pnation.com">&larr; Main Site</a>
      </div>
      <div class="user-chip" id="user-chip"></div>
    </div>
    <div class="console-body">
      <div id="gate-msg"></div>
      <div id="panel" style="display:none;">
        <div class="crm-contact-header">
          <a href="/crm.html" class="crm-back-link">&larr; Back to CRM</a>
          <span id="ct-save-status" class="crm-save-status"></span>
          <!-- Prev / Next through the list the CRM board last showed. Filled by
               contact-page.js; stays hidden when there is nowhere to go. -->
          <nav class="ct-nav" id="ct-nav" aria-label="Move between contacts" hidden>
            <button class="ct-nav-btn" id="ct-prev" type="button" title="Previous contact (←)">&lsaquo; Prev</button>
            <span class="ct-nav-pos" id="ct-nav-pos"></span>
            <button class="ct-nav-btn ct-nav-next" id="ct-next" type="button" title="Next contact (→)">Next &rsaquo;</button>
          </nav>
        </div>

        <div class="ct-layout">
          <!-- ── Left: who they are, and every way to reach them ── -->
          <aside class="ct-left">
            <div class="card ct-profile">
              <input id="ct-name" class="crm-contact-name-input" placeholder="Name" />
              <div class="crm-contact-sub" id="ct-sub"></div>

              <div class="ct-actions">
                <button class="ct-action ct-action-primary" id="btn-call-contact"><span class="ct-action-ico">&#9742;</span>Call</button>
                <button class="ct-action" id="btn-text-contact"><span class="ct-action-ico">&#128172;</span>Text</button>
                <button class="ct-action" id="btn-send-email"><span class="ct-action-ico">&#9993;</span>Email</button>
                <button class="ct-action" id="btn-schedule-contact"><span class="ct-action-ico">&#128197;</span>Book</button>
                <button class="ct-action" id="btn-add-task"><span class="ct-action-ico">&#10003;</span>Task</button>
                <button class="ct-action" id="btn-sequence-contact"><span class="ct-action-ico">&#8694;</span>Seq</button>
              </div>

              <!-- The softphone renders here while a call is live, so the
                   record stays on screen the whole time. -->
              <div id="ct-call-panel"></div>

              <div class="ct-fields">
                <div class="crm-field"><label>Phone</label><input id="ct-phone" class="c-input" placeholder="+1 555…" /></div>
                <div class="crm-field"><label>Email</label><input id="ct-email" class="c-input" placeholder="name@example.com" /></div>
                <div class="crm-field"><label>Stage</label><select id="ct-stage" class="c-input crm-select"></select></div>
                <div class="crm-field"><label>Owner</label><select id="ct-owner" class="c-input crm-select"></select></div>
                <div class="crm-field"><label>Company</label><input id="ct-company" class="c-input" placeholder="Acme Inc." /></div>
                <div class="crm-field"><label>Source</label><select id="ct-source" class="c-input crm-select"></select></div>
                <div class="crm-field ct-field-wide"><label>Source details</label><textarea id="ct-source-detail" class="c-input ct-source-detail" rows="2" maxlength="500" placeholder="Who referred them, which event, what they asked about…"></textarea></div>
              </div>

              <div class="crm-tags-block">
                <div id="ct-tags" class="crm-tags"></div>
                <form class="crm-add-tag" id="ct-add-tag-form">
                  <input id="ct-add-tag" class="c-input" placeholder="Add tag, press Enter" />
                </form>
              </div>

              <div class="crm-consent-row">
                <label class="crm-consent-check" id="ct-beta-wrap" title="Approve into the beta: grants course access and emails the invite"><input type="checkbox" id="ct-beta" /> Beta tester</label>
                <label class="crm-consent-check"><input type="checkbox" id="ct-dnc" /> Do not call</label>
                <span class="crm-consent-note" id="ct-sms-consent"></span>
                <button class="crm-chip" id="btn-record-consent" hidden>Record SMS consent</button>
              </div>

              <div id="ct-beta-courses" hidden style="margin-top:10px;">
                <div style="font-size:10px; font-family:'Space Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--gray-mid); margin-bottom:6px;">Beta courses</div>
                <div id="ct-beta-progress" style="font-size:12px; line-height:1.7; margin-bottom:8px;"></div>
                <div id="ct-beta-picker"></div>
                <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                  <button class="crm-chip" type="button" id="btn-beta-courses">Save &amp; enroll</button>
                  <span style="font-size:11px; color:var(--gray-mid);">Grants beta access and emails the invite.</span>
                </div>
              </div>

              <div class="crm-save-row">
                <button class="btn btn-ghost btn-sm" id="btn-delete-contact">Delete</button>
                <button class="btn btn-primary btn-sm" id="btn-save-contact">Save changes</button>
              </div>
            </div>

            <div class="card ct-side">
              <div class="ct-side-head">Upcoming <button class="crm-chip" id="btn-add-appt">+ Book</button></div>
              <div id="side-upcoming"></div>
            </div>

            <div class="card ct-side">
              <div class="ct-side-head">Follow-ups <button class="crm-chip" id="btn-add-followup">+ Task</button></div>
              <div id="side-followups"></div>
            </div>

            <div class="card ct-side">
              <div class="ct-side-head">Deals <button class="crm-chip" id="btn-add-deal">+ Deal</button></div>
              <div id="side-deals"></div>
            </div>
          </aside>

          <!-- ── Right: one timeline of every touch, newest first ── -->
          <section class="ct-right">
            <div class="card ct-timeline">
              <div class="tl-compose" id="tl-compose">
                <div class="tl-compose-tabs">
                  <button class="tl-tab active" data-compose="sms">Text</button>
                  <button class="tl-tab" data-compose="note">Note</button>
                  <button class="tl-tab" data-compose="email">Email</button>
                </div>
                <div id="tl-compose-body"></div>
              </div>

              <div class="tl-filters" id="tl-filters">
                <button class="crm-chip active" data-tl="all">All</button>
                <button class="crm-chip" data-tl="sms">Texts</button>
                <button class="crm-chip" data-tl="call">Calls</button>
                <button class="crm-chip" data-tl="email">Emails</button>
                <button class="crm-chip" data-tl="note">Notes</button>
                <button class="crm-chip" data-tl="appointment">Appointments</button>
                <button class="crm-chip" data-tl="task">Tasks</button>
                <button class="crm-chip" data-tl="system">System</button>
                <span class="tl-count" id="tl-count"></span>
              </div>
              <div id="tl-feed" class="tl-feed"></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="js/contact-page.js"></script>
</body>
</html>
