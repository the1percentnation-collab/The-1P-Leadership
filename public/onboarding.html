<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RBH536HRZE"></script>
  <script src="/js/ga.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete your profile | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="auth-shell onboarding-shell">
    <div class="auth-card onboarding-card">
      <a class="auth-brand" href="https://the1pnation.com" aria-label="The One Percent Nation">
        <img src="/assets/academy-logo.png" alt="" class="auth-brand-mark">
      </a>
      <div class="brand-badge">Member Portal</div>
      <h1>YOUR <span>DETAILS</span></h1>
      <div class="auth-sub">One quick step before you start — this helps us tailor your experience and keep you in the loop.</div>

      <div id="auth-msg"></div>

      <form class="auth-form" id="onboarding-form" novalidate>
        <div class="ob-field">
          <label for="displayName">Full name *</label>
          <input id="displayName" type="text" autocomplete="name" placeholder="First & Last name" required />
        </div>

        <div class="ob-field">
          <label for="phone">Phone *</label>
          <input id="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="000-000-0000" required />
        </div>

        <div class="ob-field ob-field-full">
          <label for="address">Address</label>
          <input id="address" type="text" autocomplete="street-address" placeholder="Start typing your address…" />
        </div>

        <div class="ob-field">
          <label for="company">Organization / Company</label>
          <input id="company" type="text" autocomplete="organization" />
        </div>

        <div class="ob-field">
          <label for="industry">Industry</label>
          <input id="industry" type="text" list="industry-list" autocomplete="off" />
          <datalist id="industry-list">
            <option value="Coaching"></option>
            <option value="Consulting"></option>
            <option value="Technology"></option>
            <option value="Finance"></option>
            <option value="Healthcare"></option>
            <option value="Education"></option>
            <option value="Real Estate"></option>
            <option value="Retail"></option>
            <option value="Nonprofit"></option>
            <option value="Ministry / Faith"></option>
            <option value="Other"></option>
          </datalist>
        </div>

        <div class="ob-field ob-field-full">
          <label for="goals">What do you want to achieve?</label>
          <textarea id="goals" rows="3" placeholder="Your goals for joining the Academy"></textarea>
        </div>

        <label class="auth-consent ob-field-full" for="consent">
          <input id="consent" type="checkbox" />
          <span id="consent-text">I agree to receive calls, text messages (SMS), and emails from The One Percent Nation at the phone number and email address I provided — including account updates, course information, and marketing. Message &amp; data rates may apply and message frequency varies. Consent is not a condition of any purchase. I can opt out at any time by replying STOP to texts or using the unsubscribe link in emails.</span>
        </label>

        <button class="btn btn-primary ob-field-full" type="submit" id="btn-submit">Enter the Academy →</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/page-onboarding.js"></script>
</body>
</html>
