<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RBH536HRZE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-RBH536HRZE");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Library shelf. Covers carry the page, so the chrome stays quiet. */
    .lib-continue {
      display: grid; grid-template-columns: 120px 1fr; gap: 28px; align-items: center;
      padding: 26px; border: 1px solid var(--border); border-radius: 18px; background: var(--charcoal);
      text-decoration: none; color: inherit; margin-bottom: 44px; transition: border-color .2s, transform .2s;
    }
    .lib-continue:hover { border-color: var(--border-red); transform: translateY(-2px); }
    .lib-continue img, .lib-cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 4px; display: block;
      box-shadow: 0 16px 36px rgba(0,0,0,.45); background: var(--surface2); }
    .lib-kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
    .lib-title { font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px); line-height: 1; letter-spacing: .02em; text-transform: uppercase; margin: 0 0 8px; }
    .lib-where { color: var(--white-dim); font-size: 15px; margin-bottom: 18px; }
    .lib-bar { height: 3px; border-radius: 3px; background: var(--border); overflow: hidden; }
    .lib-bar > i { display: block; height: 100%; background: var(--red); }
    .lib-meta { display: flex; justify-content: space-between; margin-top: 8px; font-family: var(--font-mono); font-size: 10.5px; color: var(--gray-light); letter-spacing: .06em; }
    .lib-cta { display: inline-block; margin-top: 18px; padding: 11px 18px; border-radius: 10px; background: var(--red); color: #fff; font-weight: 600; font-size: 14px; }
    .lib-shelf-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gray-light); margin: 0 0 18px; }
    .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 22px; }
    .lib-book { text-decoration: none; color: inherit; display: block; }
    .lib-book .lib-cover { transition: transform .2s, box-shadow .2s; }
    .lib-book:hover .lib-cover { transform: translateY(-4px); box-shadow: 0 22px 44px rgba(0,0,0,.55); }
    .lib-book-title { font-size: 14px; font-weight: 600; margin-top: 12px; line-height: 1.3; }
    .lib-book-sub { font-size: 12px; color: var(--gray-light); margin-top: 4px; }
    .lib-book .lib-bar { margin-top: 10px; }
    .lib-cover-fallback { display: grid; place-items: center; padding: 14px; text-align: center; font-family: var(--font-display); font-size: 22px; letter-spacing: .03em; line-height: 1; color: var(--white); background: linear-gradient(160deg, #1d1d1d, #0c0c0c); border: 1px solid var(--border); }
    .lib-empty { padding: 40px; border: 1px dashed var(--border); border-radius: 18px; text-align: center; color: var(--white-dim); line-height: 1.6; }
    .lib-empty h2 { font-family: var(--font-display); font-weight: 400; font-size: 32px; letter-spacing: .03em; color: var(--white); margin: 0 0 8px; }
    .lib-skel { height: 220px; border-radius: 18px; background: linear-gradient(90deg, var(--charcoal), var(--surface), var(--charcoal)); background-size: 200% 100%; animation: libsk 1.4s infinite; }
    @keyframes libsk { to { background-position: -200% 0; } }
    @media (max-width: 560px) {
      .lib-continue { grid-template-columns: 88px 1fr; gap: 18px; padding: 18px; }
      .lib-grid { grid-template-columns: repeat(2, 1fr); gap: 24px 16px; }
    }
  </style>
</head>
<body class="academy-hub">

<div class="ak-shell">
  <aside class="ak-sidebar" id="ak-sidebar"></aside>
  <div class="ak-main">
      <header class="ak-topbar">
        <div class="ak-search" id="ak-search" role="button" tabindex="0"
             aria-label="Search courses, posts and members">
          <svg class="ak-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6.2"/><path d="m15.6 15.6 4 4"/>
          </svg>
          <span>Search courses, posts and members…</span>
        </div>
        <div class="user-chip" id="user-chip"></div>
      </header>


  <main class="ak-content">

    <section class="academy-hero">
      <div class="academy-eyebrow">Your Library</div>
      <h1>Read anywhere. <span>Pick up where you left off.</span></h1>
      <p>Every book that comes with your courses lives here. Open it on your phone, tablet or laptop and it opens to the page you were on.</p>
    </section>

    <div id="lib-root"><div class="lib-skel"></div></div>

    </main>
  </div>
</div>

<script type="module" src="js/library-page.js"></script>
</body>
</html>
