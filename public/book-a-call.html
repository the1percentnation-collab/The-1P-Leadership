  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Call | The One Percent</title>
  <meta name="description" content="Book time with Anthony Brown, founder of The One Percent. Pick a time that works and the Zoom link comes straight to your inbox.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

<body style="display:block; height:auto; overflow:auto;">
  <div class="console-shell">
    <div class="console-topbar">
      <div class="console-topbar-left">
        <a class="console-brand" href="/index.html" aria-label="The One Percent Academy">
          <img src="/assets/academy-logo.png" alt="" class="console-brand-mark">
        </a>
        <a class="back-to-main" href="https://the1pnation.com">&larr; Main Site</a>
      </div>
      <div class="user-chip" id="user-chip"></div>
    </div>
    <div class="console-body">
      <div style="max-width:960px; margin:0 auto;">

        <div style="text-align:center; margin:28px 0 20px;">
          <h1 style="font-family:'Bebas Neue',sans-serif; letter-spacing:1px; font-size:38px; margin-bottom:8px;">Book a Call with Anthony</h1>
          <p style="color:var(--gray-light); font-size:15px; max-width:600px; margin:0 auto;">
            Pick a time that works for you. The conversation happens on Zoom and
            the link lands in your inbox the moment you book.
          </p>
        </div>

        <div class="card" style="padding:0; overflow:hidden;">
          <iframe id="scheduler-frame" title="Schedule a call with Anthony"
            src=""
            style="display:block; width:100%; height:720px; border:0; background:#fff;"
            allow="clipboard-write"
            loading="lazy"></iframe>
        </div>

        <p style="text-align:center; color:var(--gray-mid); font-size:13px; margin:16px 0 36px;">
          Calendar not loading?
          <a id="scheduler-fallback" href="" target="_blank" rel="noopener">Open the scheduler in a new tab →</a>
        </p>

      </div>
    </div>
  </div>

  <script type="module" src="js/book-a-call.js"></script>
