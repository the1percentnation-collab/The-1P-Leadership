<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RBH536HRZE"></script>
  <script src="/js/ga.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept invite | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="https://the1pnation.com" aria-label="The One Percent Nation">
        <img src="/assets/academy-logo.png" alt="" class="auth-brand-mark">

      </a>
      <div class="brand-badge">Member Portal</div>
      <h1>ACCEPT <span>INVITE</span></h1>
      <div class="auth-sub" id="sub">Preparing your invite…</div>

      <div id="auth-msg"></div>

      <div id="code-display" class="invite-code" style="display:none;"></div>

      <div id="actions" style="display:none;">
        <a class="btn btn-primary" id="btn-signup" href="#" style="display:inline-block; width:100%; text-align:center; text-decoration:none;">Create account &amp; join</a>
        <div style="height:10px;"></div>
        <a class="btn btn-ghost" id="btn-login" href="#" style="display:inline-block; width:100%; text-align:center; text-decoration:none;">I already have an account</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/page-invite.js"></script>
</body>
</html>
