<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Reports | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .sev-badge {
      display: inline-block;
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
    }
    .sev-critical { background: #7f0000; color: #ffd4d4; }
    .sev-high     { background: #7f3800; color: #ffe0b2; }
    .sev-medium   { background: #5a4a00; color: #fff3b2; }
    .sev-low      { background: #1a3a1a; color: #b2f5b2; }
    .sev-unknown  { background: #2a2a2a; color: #aaa; }

    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-family: 'Space Mono', monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .status-open     { background: rgba(230,3,6,.15); color: #E60306; border: 1px solid rgba(230,3,6,.3); }
    .status-resolved { background: rgba(74,222,128,.1); color: #4ade80; border: 1px solid rgba(74,222,128,.25); }

    .report-row {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      background: var(--surface);
    }
    .report-row:hover { border-color: rgba(230,3,6,.4); background: rgba(230,3,6,.04); }
    .report-row-top { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .report-desc { flex: 1; font-size: 13.5px; line-height: 1.5; min-width: 0; word-break: break-word; }
    .report-meta { font-size: 11px; color: var(--gray-light); margin-top: 5px; display: flex; gap: 14px; flex-wrap: wrap; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 1000;
      overflow-y: auto;
      padding: 24px 16px;
    }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal-box {
      width: 100%;
      max-width: 760px;
      background: var(--surface);
      border-radius: 14px;
      padding: 28px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: var(--gray-light);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background .15s;
    }
    .modal-close:hover { background: rgba(255,255,255,.08); color: var(--text); }
    .ai-block {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 340px;
      overflow-y: auto;
    }
  </style>
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="console-shell">
    <div class="console-topbar">
      <div class="console-topbar-left">
        <a class="console-brand" href="/dashboard.html" aria-label="The One Percent Academy">
          <img src="/assets/academy-logo.png" alt="" class="console-brand-mark">
        </a>
        <a class="back-to-main" href="/owner.html">&larr; Owner Console</a>
      </div>
      <div class="user-chip" id="user-chip"></div>
    </div>
    <div class="console-body">
      <div id="gate-msg"></div>
      <div id="panel" style="display:none;">
        <div class="card">
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
            <h2 style="margin:0;">Bug Reports</h2>
            <div style="display:flex; align-items:center; gap:10px;">
              <label style="font-size:12px; color:var(--gray-light);">
                Status:
                <select id="filter-status" style="margin-left:6px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:12px;">
                  <option value="open" selected>Open</option>
                  <option value="resolved">Resolved</option>
                  <option value="all">All</option>
                </select>
              </label>
            </div>
          </div>
          <p style="font-size:13px; color:var(--gray-light); margin-bottom:16px;">
            AI-analyzed bug reports submitted by users. Click a report to view the screenshot and fix proposal, then mark it resolved.
          </p>
          <div id="reports-list"></div>
          <div id="reports-empty" style="display:none; padding:24px 0; text-align:center; color:var(--gray-light); font-size:13px;">No reports match this filter.</div>
          <div id="reports-loading" style="padding:24px 0; text-align:center; color:var(--gray-light); font-size:13px;">Loading…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script type="module" src="/js/page-bug-reports.js"></script>
</body>
</html>
