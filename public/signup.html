<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RBH536HRZE"></script>
  <script src="/js/ga.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="auth-shell">
    <div class="auth-card">
      <a class="auth-brand" href="https://the1pnation.com" aria-label="The One Percent Nation">
        <img src="/assets/academy-logo.png" alt="" class="auth-brand-mark">

      </a>
      <div class="brand-badge">Member Portal</div>
      <h1>CREATE <span>ACCOUNT</span></h1>
      <div class="auth-sub">Start your Academy journey.</div>

      <div id="auth-msg"></div>

      <form class="auth-form" id="signup-form" novalidate>
        <label for="displayName">Full name</label>
        <input id="displayName" type="text" autocomplete="name" required />

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password (8+ characters)</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />

        <label for="inviteCode">Invite code (optional)</label>
        <input id="inviteCode" type="text" autocomplete="one-time-code" placeholder="From your company admin" />

        <button class="btn btn-primary" type="submit" id="btn-submit">Create account</button>
        <button class="btn btn-google" type="button" id="btn-google">Continue with Google</button>
      </form>

      <div class="auth-footer">
        <a href="/login.html">I already have an account</a>
      </div>
      <div class="auth-back">
        <a class="back-to-main" href="https://the1pnation.com">← Back to Main Site</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/page-signup.js"></script>
<script src="/js/consent-banner.js" defer></script>
</body>
</html>
