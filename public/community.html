<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="console-shell">
    <div class="console-topbar">
      <div class="console-title">The One Percent <span>Academy</span></div>
      <div class="user-chip" id="user-chip"></div>
    </div>
    <div class="console-body c-shell">
      <div id="gate-msg"></div>

      <section class="c-dashboard-hero" id="dashboard-hero"></section>

      <aside class="c-sidebar" id="sidebar"></aside>

      <main class="c-main">
        <nav class="c-channel-chips-scroll" id="channel-chips" aria-label="Channels"></nav>
        <nav class="c-tabs" id="community-tabs" aria-label="Community sections"></nav>
        <div class="c-channel-header" id="channel-header"></div>

        <div class="card c-composer-card">
          <div id="composer"></div>
        </div>

        <div id="feed" class="c-feed"></div>
        <div id="feed-loading" class="c-feed-loading"></div>
        <div class="c-load-more-wrap">
          <button class="btn btn-ghost" id="load-more" style="display:none;">Load more</button>
        </div>
      </main>

      <aside class="c-rightrail" id="rightrail">
        <section class="c-group-card" id="group-card"></section>
        <section class="c-leaderboard" id="leaderboard"></section>
      </aside>
    </div>
  </div>

  <script type="module" src="js/community-page.js"></script>
</body>
</html>
