<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community | 1P-CLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="console-shell">
    <div class="console-topbar">
      <div class="console-title">1P-CLC <span>COMMUNITY</span></div>
      <div class="user-chip" id="user-chip"></div>
    </div>
    <div class="console-body c-shell">
      <div id="gate-msg"></div>

      <div class="card c-composer-card">
        <div id="composer"></div>
      </div>

      <div id="feed" class="c-feed"></div>
      <div id="feed-loading" class="c-feed-loading"></div>
      <div class="c-load-more-wrap">
        <button class="btn btn-ghost" id="load-more" style="display:none;">Load more</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/community-page.js"></script>
</body>
</html>
