  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#E60306">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>CRM | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<body style="display:block; height:auto; overflow:auto;">
  <div class="console-shell">
    <div class="console-topbar">
      <div class="console-topbar-left">
        <a class="console-brand" href="/dashboard.html" aria-label="The One Percent Academy">
          <img src="/assets/academy-logo.png" alt="" class="console-brand-mark">

        </a>
        <a class="back-to-main" href="https://the1pnation.com">&larr; Main Site</a>
      </div>
      <div class="user-chip" id="user-chip"></div>
    </div>
    <div class="console-body">
      <div id="gate-msg"></div>
      <div id="panel" style="display:none;">
        <div class="crm-toolbar">
          <div class="crm-tabs">
            <button class="crm-tab active" data-tab="kanban">Kanban</button>
            <button class="crm-tab" data-tab="list">List</button>
          </div>
          <div class="crm-toolbar-spacer"></div>
          <input id="crm-search" class="c-input crm-search" placeholder="Search name or email…" />
          <button class="btn btn-primary" id="btn-new-contact">+ New Contact</button>
        </div>

        <div class="crm-filters">
          <div class="crm-chip-row" id="crm-owner-chips">
            <button class="crm-chip active" data-owner-filter="all">All</button>
            <button class="crm-chip" data-owner-filter="mine">Mine</button>
          </div>
          <div class="crm-chip-row" id="crm-stage-chips"></div>
          <div class="crm-chip-row" id="crm-tag-chips"></div>
        </div>

        <div id="view-kanban" class="crm-view"></div>
        <div id="view-list" class="crm-view" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="js/crm-page.js"></script>
  <script src="/js/capacitor-bridge.js" type="module"></script>
  <script src="/js/register-sw.js"></script>
</body>
</html>
