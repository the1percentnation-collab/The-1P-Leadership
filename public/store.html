<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RBH536HRZE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-RBH536HRZE");
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store | The One Percent Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="academy-hub">

<div class="ak-shell">
  <aside class="ak-sidebar" id="ak-sidebar"></aside>
  <div class="ak-main">
      <header class="ak-topbar">
        <div class="ak-search" id="ak-search" role="button" tabindex="0"
             aria-label="Search courses, posts and members">
          <svg class="ak-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6.2"/><path d="m15.6 15.6 4 4"/>
          </svg>
          <span>Search courses, posts and members…</span>
        </div>
        <div class="user-chip" id="user-chip"></div>
      </header>

    <main class="ak-content">

      <section class="academy-hero">
        <div class="academy-eyebrow">Academy Store</div>
        <h1>Courses. Books. <span>What's next.</span></h1>
        <p>Everything The One Percent offers, in one place — what's open now, what's opening soon, and what's on sale.</p>
      </section>

      <!-- Filled by js/store-page.js from the catalog. Tabs slice the same
           list; nothing is fetched per tab. -->
      <div class="hub-activity-tabs" id="store-tabs" role="tablist" aria-label="Filter the store">
        <button class="hub-activity-tab is-active" type="button" role="tab" aria-selected="true" data-tab="all">All</button>
        <button class="hub-activity-tab" type="button" role="tab" aria-selected="false" data-tab="live">Live</button>
        <button class="hub-activity-tab" type="button" role="tab" aria-selected="false" data-tab="coming-soon">Coming soon</button>
        <button class="hub-activity-tab" type="button" role="tab" aria-selected="false" data-tab="on-sale">On sale</button>
      </div>

      <div class="store-grid" id="store-grid">
        <div class="academy-empty">Loading the store…</div>
      </div>

    </main>
  </div>
</div>

<div id="modal-root"></div>

<script type="module" src="js/store-page.js"></script>
<script type="module">
  import { init as initChatbot } from './js/chatbot.js';
  initChatbot();
</script>
</body>
</html>
