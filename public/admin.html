<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console | 1P-CLC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display:block; height:auto; overflow:auto;">
  <div class="console-shell">
    <div class="console-topbar">
      <div class="console-title">1P-CLC <span>ADMIN</span></div>
      <div class="user-chip" id="user-chip"></div>
    </div>
    <div class="console-body">
      <div id="gate-msg"></div>
      <div id="panel" style="display:none;">
        <div class="card">
          <h2 id="company-name">Company</h2>
          <div id="company-meta" style="font-size:12px; color:var(--gray-light); margin-bottom:12px;"></div>
          <div id="seat-stats" style="display:flex; gap:24px; font-family:var(--font-mono); font-size:12px;"></div>
        </div>

        <div class="card">
          <h2>Invite an employee</h2>
          <form class="inline-form" id="invite-form">
            <div class="field">
              <label for="invite-email">Email</label>
              <input id="invite-email" type="email" required />
            </div>
            <button class="btn btn-primary" type="submit">Generate invite</button>
          </form>
          <div id="invite-result"></div>
        </div>

        <div class="card">
          <h2>Roster</h2>
          <div id="roster-msg" style="font-size:12px; color:var(--gray-light); margin-bottom:10px;"></div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Progress</th>
                <th>Done</th>
                <th>Last active</th>
                <th>Capstone</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="roster-body"></tbody>
          </table>
        </div>

        <div class="card">
          <h2>Pending invites</h2>
          <table class="data-table">
            <thead>
              <tr>
                <th>Email</th>
                <th>Code</th>
                <th>Status</th>
                <th>Link</th>
              </tr>
            </thead>
            <tbody id="invites-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
